# Runs the whole check suite on every push and pull request:
# lint, type check, unit and property tests, then the browser tests against a fresh build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and formatting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and property tests
        run: npm test

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      # Builds the website, starts the server and drives it in Chromium.
      # Any console error or warning, accessibility violation or overflow fails the run.
      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the browser test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Firefox is not a supported browser yet (see the Limitations page): some of its
  # automated checks still fail. This job keeps running them so progress is visible, but
  # it does not block a change. Remove `continue-on-error` once it passes reliably.
  firefox-preview:
    name: Firefox (not supported yet, does not block)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Browser tests in Firefox, one at a time
        run: npx playwright test --project=firefox --workers=1
        env:
          PW_FIREFOX: '1'

      - name: Keep the Firefox report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-firefox
          path: |
            playwright-report/
            test-results/
          retention-days: 7
