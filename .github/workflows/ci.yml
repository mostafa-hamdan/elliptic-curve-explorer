# Runs the whole check suite on every push and pull request:
# lint, type check, unit and property tests, build, then the browser tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and formatting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and property tests
        run: npm test
