# Runs the whole check suite on every push and pull request:
# lint, type check, unit and property tests, then the browser tests against a fresh build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and formatting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and property tests
        run: npm test

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox

      # Builds the website, starts the server and drives it in Chromium and Firefox.
      # Any console error or warning, accessibility violation or overflow fails the run.
      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the browser test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
